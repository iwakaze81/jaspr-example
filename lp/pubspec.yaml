name: lp
description: Pulse Landing Page — Jaspr static site example

publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  jaspr: ^0.23.1
  jaspr_flutter_embed: ^0.4.11

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.4.19
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  jaspr_builder: ^0.23.1
  jaspr_cli: ^0.23.1
  jaspr_lints: ^0.7.1

jaspr:
  mode: static
  flutter: embedded

flutter:
  uses-material-design: true
