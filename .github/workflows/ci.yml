name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lp:
    name: Jaspr LP (analyze & format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: lp
        run: dart pub get

      - name: Analyze
        working-directory: lp
        run: dart analyze

      - name: Format check
        working-directory: lp
        run: dart format --output=none --set-exit-if-changed .

  flutter_app:
    name: Flutter App (analyze & format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Format check
        working-directory: flutter_app
        run: dart format --output=none --set-exit-if-changed .
