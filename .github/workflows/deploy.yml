name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Flutter (via FVM)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      # ── Flutter Web App ──────────────────────────────────────────
      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: flutter_app
        run: |
          flutter build web \
            --base-href /app/ \
            --release

      # ── Jaspr LP ─────────────────────────────────────────────────
      - name: Install Jaspr dependencies
        working-directory: lp
        run: dart pub get

      - name: Build Jaspr LP
        working-directory: lp
        run: dart run jaspr_cli:jaspr build --dart-define=BASE_HREF=/jaspr-example/

      # ── 統合 ────────────────────────────────────────────────────
      - name: Merge build outputs
        run: |
          mkdir -p dist/app
          cp -r lp/build/jaspr/. dist/
          cp -r flutter_app/build/web/. dist/app/

      # ── Deploy ──────────────────────────────────────────────────
      # gh-pages ブランチへ push。pr-preview/ 以下は PR プレビュー用に保持する。
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview
          single-commit: true
