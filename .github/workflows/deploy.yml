name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Flutter (via FVM)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      # ── Flutter Web App ──────────────────────────────────────────
      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: flutter_app
        run: |
          flutter build web \
            --base-href /jaspr-example/app/ \
            --release

      # ── Jaspr LP ─────────────────────────────────────────────────
      - name: Install Jaspr dependencies
        working-directory: lp
        run: dart pub get

      - name: Build Jaspr LP
        working-directory: lp
        run: dart run jaspr_cli:jaspr build

      # ── 統合 ────────────────────────────────────────────────────
      - name: Merge build outputs
        run: |
          mkdir -p dist/app
          cp -r lp/build/jaspr/. dist/
          cp -r flutter_app/build/web/. dist/app/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
