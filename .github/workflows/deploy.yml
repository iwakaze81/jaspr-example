name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter (via FVM)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      # ── Flutter Web App ──────────────────────────────────────────
      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: flutter_app
        run: |
          flutter build web \
            --base-href /jaspr-example/app/ \
            --release

      # ── Jaspr LP ─────────────────────────────────────────────────
      - name: Install Jaspr dependencies
        working-directory: lp
        run: dart pub get

      - name: Build Jaspr LP
        working-directory: lp
        run: dart run jaspr build

      # ── 統合 & デプロイ ──────────────────────────────────────────
      - name: Merge build outputs
        run: |
          mkdir -p dist/app
          # LP を dist/ のルートに配置
          cp -r lp/build/web/. dist/
          # Flutter Web を dist/app/ に配置
          cp -r flutter_app/build/web/. dist/app/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # SPA フォールバック: 404 → index.html（Flutter Web 用）
          enable_jekyll: false
