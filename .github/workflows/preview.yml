name: Deploy PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# PR ごとに直列化。新しい push が来たら進行中のビルドはキャンセル。
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    # フォークからの PR ではシークレット/書込権限を渡せないためスキップ。
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Flutter (via FVM)
        if: github.event.action != 'closed'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      # ── Jaspr LP のみビルド（プレビュー対象は LP のみ）──────────
      - name: Install Jaspr dependencies
        if: github.event.action != 'closed'
        working-directory: lp
        run: dart pub get

      - name: Build Jaspr LP
        if: github.event.action != 'closed'
        working-directory: lp
        run: |
          dart run jaspr_cli:jaspr build \
            --dart-define=BASE_HREF=/jaspr-example/pr-preview/pr-${{ github.event.number }}/

      # ── Deploy / Cleanup ────────────────────────────────────────
      # action: auto  →  open/sync は deploy、close は preview を削除。
      - name: Deploy preview to gh-pages
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: lp/build/jaspr
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
